# fjrxb.beauty → Next.js (127.0.0.1:3010)
# Keep /zf756f46aws on HTTP 80 (and HTTPS) for existing VLESS-WS clients.
# Do not 301-redirect that path.

upstream ai_supermarket {
    server 127.0.0.1:3010;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name fjrxb.beauty www.fjrxb.beauty;

    include /etc/nginx/snippets/vless-ws.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fjrxb.beauty www.fjrxb.beauty;

    ssl_certificate     /etc/letsencrypt/live/www.fjrxb.beauty/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.fjrxb.beauty/privkey.pem;
    # options-ssl-nginx.conf already pins TLSv1.2+ / modern ciphers — do not duplicate.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/vless-ws.conf;

    client_max_body_size 32m;

    location / {
        proxy_pass http://ai_supermarket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
